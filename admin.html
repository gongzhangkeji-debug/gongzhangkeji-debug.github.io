<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品集后台管理 · 云端</title>
<script src="sortable.min.js"></script>
<style>
  :root{
    --cream:#FAF6EC; --cream2:#F1EDE1; --card:#FFFDF8;
    --mint:#A8D5BE; --mint-soft:#DCEDE2; --mint-deep:#5E9B81; --mint-ink:#3E6B58;
    --ink:#3B4A43; --ink2:#7D8C83; --warn:#E2A14B; --danger:#D96A5B;
    --line:rgba(94,155,129,.22);
    --sh:0 10px 30px rgba(59,74,67,.10);
    --radius:18px; --ease:cubic-bezier(.22,.8,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--cream);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  .wrap{max-width:960px;margin:0 auto;padding:0 24px;}

  .bar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 0;}
  .bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .bar .who{font-size:14px;color:var(--ink2);}
  .bar .who b{color:var(--mint-ink);}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:10px;font-size:14px;font-weight:600;transition:all .25s var(--ease);}
  .btn-primary{background:var(--mint-deep);color:#fff;}
  .btn-primary:hover{background:#4E8871;transform:translateY(-1px);}
  .btn-ghost{background:var(--cream2);color:var(--ink);border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--mint-soft);}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none;}

  header{padding:32px 0 8px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  header h1{font-size:25px;font-weight:700;}
  header p{font-size:14px;color:var(--ink2);margin-top:4px;}

  .login-panel{margin:28px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:40px 28px;text-align:center;box-shadow:var(--sh);}
  .login-panel h2{font-size:19px;margin-bottom:8px;}
  .login-panel p{font-size:14px;color:var(--ink2);margin-bottom:22px;line-height:1.8;}
  .login-panel .err{color:var(--danger);font-size:13px;margin-top:14px;min-height:20px;}
  .login-panel .hint{margin-top:20px;padding:12px 16px;background:var(--mint-soft);border-radius:10px;font-size:12.5px;color:var(--mint-ink);text-align:left;line-height:1.7;}

  .dropzone{margin:22px 0 26px;border:2px dashed var(--mint);border-radius:var(--radius);background:var(--card);padding:40px 24px;text-align:center;cursor:pointer;transition:all .3s var(--ease);}
  .dropzone:hover{border-color:var(--mint-deep);background:var(--mint-soft);}
  .dropzone.dragover{border-color:var(--mint-deep);background:var(--mint-soft);transform:scale(1.01);box-shadow:var(--sh);}
  .dropzone .dz-icon{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;background:var(--mint-soft);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--mint-deep);}
  .dropzone .dz-title{font-size:16px;font-weight:600;color:var(--mint-ink);}
  .dropzone .dz-sub{font-size:13px;color:var(--ink2);margin-top:6px;}
  .dropzone input[type=file]{display:none;}

  .card-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;padding-bottom:40px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 10px rgba(59,74,67,.05);transition:transform .25s var(--ease),box-shadow .25s var(--ease);}
  .card.sortable-chosen{transform:scale(1.03);box-shadow:0 16px 40px rgba(59,74,67,.18);}
  .card.sortable-ghost{opacity:.4;border:2px dashed var(--mint);}
  .card .preview{width:100%;height:150px;background:var(--cream2);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .card .preview img,.card .preview video{width:100%;height:100%;object-fit:cover;display:block;}
  .card .card-body{padding:14px 16px;}
  .card .title-input{width:100%;font:inherit;font-size:15px;font-weight:600;color:var(--ink);border:1px solid transparent;border-radius:8px;padding:6px 8px;background:transparent;transition:all .2s var(--ease);}
  .card .title-input:hover{background:var(--cream);}
  .card .title-input:focus{outline:none;border-color:var(--mint);background:#fff;}
  .card .card-foot{display:flex;align-items:center;justify-content:space-between;padding:0 16px 14px;}
  .card .type-tag{font-size:12px;color:var(--mint-ink);background:var(--mint-soft);padding:2px 10px;border-radius:999px;}
  .card .del-btn{font-size:13px;color:var(--danger);padding:4px 12px;border-radius:8px;transition:background .2s var(--ease);}
  .card .del-btn:hover{background:rgba(217,106,91,.12);}
  .empty{grid-column:1/-1;text-align:center;color:var(--ink2);padding:40px 0;font-size:14px;}

  #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:999;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.error{background:var(--danger);}

  @media (max-width:600px){ .card-list{grid-template-columns:1fr 1fr;} }
</style>
</head>
<body>

<div class="bar">
  <div class="wrap">
    <div class="who" id="whoBox">未登录</div>
    <div id="authActions"></div>
  </div>
</div>

<div class="wrap">
  <header>
    <div>
      <h1>作品集后台管理</h1>
      <p>上传素材、编辑标题、拖拽排序——保存后首页即刻同步。</p>
    </div>
    <div style="font-size:13px;color:var(--ink2);">共 <b id="countNum" style="color:var(--mint-deep);">0</b> 个项目</div>
  </header>

  <div class="login-panel" id="loginPanel" style="display:none;">
    <h2>请先登录</h2>
    <p>后台管理需要登录身份才能写入云端数据。<br>登录后即可上传素材并同步到作品集首页。</p>
    <button class="btn btn-primary" id="signInBtn">使用 WorkBuddy 登录</button>
    <button class="btn btn-ghost" id="localModeBtn" style="margin-left:8px;">不登录，用本地模式</button>
    <div class="err" id="loginErr"></div>
    <div class="hint">
      ⚠️ 登录需在<b>已发布的域名</b>下进行（本地预览或 github.io 会被拒绝）。
      请打开 WorkBuddy 发布的链接，再进入 <code>admin.html</code> 使用后台。
    </div>
  </div>

  <div id="adminApp" style="display:none;">
    <div class="dropzone" id="dropzone">
      <div class="dz-icon">📤</div>
      <div class="dz-title">拖拽文件到这里，或点击选择</div>
      <div class="dz-sub">支持图片与视频，可多选；单文件建议不超过 2MB</div>
      <input type="file" id="fileInput" accept="image/*,video/*" multiple>
    </div>
    <div class="card-list" id="cardList"></div>
  </div>
</div>

<div id="toast"></div>

<script src="sdk-cloud.js"></script>
<script src="cloud.js"></script>
<script>
(function(){
  var MAX_FILE = 2 * 1024 * 1024;
  var cloud = window.wbCloud || null;
  var session = null;
  var cards = [];

  /* ---------- 本地缓存（与首页 localStorage 打通） ---------- */
  var LS_KEY = 'portfolio_admin_cards';
  function readLocal(){
    try{ return JSON.parse(localStorage.getItem(LS_KEY) || '[]') || []; }catch(e){ return []; }
  }
  function writeLocal(list){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(list)); }catch(e){}
  }
  /* ---------- 本地模式：不依赖云端，仅本机可见（与首页同源） ---------- */
  var localMode = false;

  function loadLocalCards(){
    var list = readLocal();
    cards = list.map(function(c, i){
      return { id: 'L' + i, title: c.title, dataUrl: c.dataUrl, type: c.type };
    });
    render();
  }
  function persistLocal(){
    writeLocal(cards.map(function(c){
      return { title: c.title, dataUrl: c.dataUrl, type: c.type };
    }));
  }
  function showLocalMode(){
    localMode = true;
    loginPanel.style.display = 'none';
    adminApp.style.display = '';
    loginErr.textContent = '';
    whoBox.innerHTML = '本地模式：<b>仅本机可见</b>';
    authActions.innerHTML = '<button class="btn btn-ghost" id="toCloudBtn">切换到云端</button>';
    document.getElementById('toCloudBtn').addEventListener('click', function(){
      localMode = false;
      restoreSession();
    });
    loadLocalCards();
    showToast('已进入本地模式（数据只存本机浏览器）');
  }

  /* 把云端数据同步成本地缓存，首页即可在云端不可达时回退显示 */
  function syncCache(){
    writeLocal(cards.map(function(c){
      return { title: c.title, dataUrl: c.dataUrl, type: c.type };
    }));
  }

  var whoBox = document.getElementById('whoBox');
  var authActions = document.getElementById('authActions');
  var loginPanel = document.getElementById('loginPanel');
  var loginErr = document.getElementById('loginErr');
  var adminApp = document.getElementById('adminApp');
  var dropzone = document.getElementById('dropzone');
  var fileInput = document.getElementById('fileInput');
  var cardList = document.getElementById('cardList');
  var countNum = document.getElementById('countNum');
  var toast = document.getElementById('toast');

  var toastTimer = null;
  function showToast(msg, isError){
    toast.textContent = msg;
    toast.className = isError ? 'error show' : 'show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.className = ''; }, 2800);
  }

  function showLoggedOut(msg){
    session = null;
    loginPanel.style.display = '';
    adminApp.style.display = 'none';
    whoBox.textContent = '未登录';
    authActions.innerHTML = '';
    loginErr.textContent = msg || '';
  }

  function showLoggedIn(user){
    session = user || {};
    loginPanel.style.display = 'none';
    adminApp.style.display = '';
    loginErr.textContent = '';
    var name = (user && user.name) ? user.name : '已登录用户';
    whoBox.innerHTML = '已登录：<b>' + name + '</b>';
    authActions.innerHTML = '<button class="btn btn-ghost" id="signOutBtn">退出登录</button>';
    document.getElementById('signOutBtn').addEventListener('click', signOut);
  }

  function signIn(){
    if(!cloud){ showToast('云服务未初始化：' + (window.wbCloudError || '未知原因'), true); return; }
    loginErr.textContent = '';
    cloud.auth.signInWithOAuth({
      provider: 'workbuddy',
      redirectTo: location.origin + location.pathname
    }).then(function(res){
      if(res.error){ loginErr.textContent = res.error.message || '发起登录失败'; return; }
      location.assign(res.data.url);
    }).catch(function(e){
      loginErr.textContent = (e && e.message) || '发起登录失败';
    });
  }

  function signOut(){
    cloud.auth.signOut().then(function(){
      showLoggedOut('已退出登录');
      showToast('已退出登录');
    }).catch(function(){ showLoggedOut('已退出登录'); });
  }

  function startup(){
    var url = new URL(location.href);
    var hasCode = url.searchParams.has('code') || url.searchParams.has('error');
    if(!hasCode){ restoreSession(); return; }

    var provider = url.searchParams.get('provider');
    if(provider !== 'workbuddy' && provider !== 'wechat'){
      restoreSession();
      return;
    }
    var handler = provider === 'workbuddy'
      ? (cloud.auth.handleWorkBuddyCallback || null)
      : (cloud.auth.handleWechatWebCallback || null);
    if(!handler){
      showLoggedOut('当前 SDK 不支持该登录方式，请稍后重试。');
      return;
    }
    handler.call(cloud.auth).then(function(res){
      if(res.error){
        showLoggedOut(res.error.message || '登录失败');
      } else if(res.data){
        ['code','state','provider'].forEach(function(k){ url.searchParams.delete(k); });
        history.replaceState(null, '', url.pathname + url.search + url.hash);
        showLoggedIn(res.data.user);
        loadProjects();
      } else {
        restoreSession();
      }
    }).catch(function(e){
      showLoggedOut((e && e.message) || '登录失败');
    });
  }

  function restoreSession(){
    if(!cloud){ showLoggedOut('云服务未初始化：' + (window.wbCloudError || '未知错误')); return; }
    cloud.auth.getSession().then(function(res){
      if(res.error || !res.data){ showLoggedOut(''); return; }
      showLoggedIn(res.data.user);
      loadProjects();
    }).catch(function(){ showLoggedOut(''); });
  }

  function loadProjects(){
    if(!cloud) return;
    cloud.database.from('projects')
      .select('id,title,data_url,type,sort_order,created_at')
      .order('sort_order', { ascending: true })
      .order('created_at', { ascending: false })
      .then(function(res){
        if(res.error){ showToast('读取失败：' + (res.error.message || '未知错误'), true); return; }
        cards = (res.data || []).map(function(r){
          return { id: r.id, title: r.title, dataUrl: r.data_url, type: r.type, sortOrder: r.sort_order };
        });
        syncCache();          /* ← 同步到本地，打通首页 */
        render();
      })
      .catch(function(e){ showToast('读取失败：' + ((e && e.message) || '网络异常'), true); });
  }

  function render(){
    cardList.innerHTML = '';
    if(cards.length === 0){
      cardList.innerHTML = '<div class="empty">还没有项目，上传一个文件开始吧～</div>';
    }
    cards.forEach(function(card){
      var el = document.createElement('div');
      el.className = 'card';
      el.dataset.id = card.id;

      var preview = document.createElement('div');
      preview.className = 'preview';
      if(card.type === 'image'){
        var img = document.createElement('img');
        img.src = card.dataUrl; img.alt = card.title || '';
        preview.appendChild(img);
      } else if(card.type === 'video'){
        var v = document.createElement('video');
        v.src = card.dataUrl; v.muted = true; v.playsInline = true;
        preview.appendChild(v);
      } else {
        preview.innerHTML = '<span style="font-size:36px;">📄</span>';
      }
      el.appendChild(preview);

      var body = document.createElement('div');
      body.className = 'card-body';
      var input = document.createElement('input');
      input.className = 'title-input';
      input.type = 'text';
      input.value = card.title || '未命名项目';
      input.placeholder = '输入项目标题…';
      input.addEventListener('change', function(){ updateTitle(card.id, input.value); });
      body.appendChild(input);
      el.appendChild(body);

      var foot = document.createElement('div');
      foot.className = 'card-foot';
      var tag = document.createElement('span');
      tag.className = 'type-tag';
      tag.textContent = card.type === 'image' ? '图片' : (card.type === 'video' ? '视频' : '文件');
      var del = document.createElement('button');
      del.className = 'del-btn';
      del.textContent = '删除';
      del.addEventListener('click', function(){ removeCard(card.id, card.title); });
      foot.appendChild(tag); foot.appendChild(del);
      el.appendChild(foot);

      cardList.appendChild(el);
    });
    countNum.textContent = cards.length;
    initSortable();
  }

  function addCard(file){
    if(localMode){
      if(file.size > MAX_FILE * 3){
        showToast('「' + file.name + '」过大，本地模式建议不超过 6MB', true); return;
      }
      var lr = new FileReader();
      lr.onload = function(e){
        var t = file.type.indexOf('image') === 0 ? 'image' : (file.type.indexOf('video') === 0 ? 'video' : 'other');
        cards.unshift({ id: 'L' + Date.now(), title: file.name.replace(/\.[^.]+$/, ''), dataUrl: e.target.result, type: t });
        persistLocal(); render();
        showToast('✅ 已保存到本地（首页刷新即可看到）');
      };
      lr.readAsDataURL(file);
      return;
    }
    if(file.size > MAX_FILE){
      showToast('「' + file.name + '」超过 2MB，无法存入云端，请压缩后再上传', true);
      return;
    }
    var reader = new FileReader();
    reader.onload = function(e){
      var dataUrl = e.target.result;
      var type = file.type.indexOf('image') === 0 ? 'image' : (file.type.indexOf('video') === 0 ? 'video' : 'other');
      var title = file.name.replace(/\.[^.]+$/, '');
      cloud.database.from('projects')
        .insert({ title: title, data_url: dataUrl, type: type, sort_order: cards.length })
        .select()
        .then(function(res){
          if(res.error){ showToast('保存失败：' + (res.error.message || '未知错误'), true); return; }
          showToast('✅ 已保存到云端：' + title);
          loadProjects();
        })
        .catch(function(err){ showToast('保存失败：' + ((err && err.message) || '网络异常'), true); });
    };
    reader.onerror = function(){ showToast('文件读取失败：' + file.name, true); };
    reader.readAsDataURL(file);
  }

  function updateTitle(id, title){
    if(localMode){
      for(var i = 0; i < cards.length; i++){ if(cards[i].id === id){ cards[i].title = title; break; } }
      persistLocal(); showToast('已更新标题'); return;
    }
    cloud.database.from('projects')
      .update({ title: title })
      .eq('id', id)
      .select()
      .then(function(res){
        if(res.error){ showToast('修改失败：' + (res.error.message || '未知错误'), true); return; }
        if(!res.data || res.data.length === 0){
          showToast('修改未生效：该条目可能不属于当前账号', true);
          return;
        }
        var target = null;
        for(var i = 0; i < cards.length; i++){ if(cards[i].id === id){ target = cards[i]; break; } }
        if(target){ target.title = title; syncCache(); }
        showToast('已更新标题');
      })
      .catch(function(e){ showToast('修改失败：' + ((e && e.message) || '网络异常'), true); });
  }

  function removeCard(id, title){
    if(!confirm('确定删除「' + (title || '该项目') + '」？此操作不可撤销。')) return;
    if(localMode){
      cards = cards.filter(function(c){ return c.id !== id; });
      persistLocal(); render(); showToast('已删除'); return;
    }
    cloud.database.from('projects')
      .delete()
      .eq('id', id)
      .select()
      .then(function(res){
        if(res.error){ showToast('删除失败：' + (res.error.message || '未知错误'), true); return; }
        if(!res.data || res.data.length === 0){
          showToast('删除未生效：该条目可能不属于当前账号', true);
          return;
        }
        cards = cards.filter(function(c){ return c.id !== id; });
        syncCache();
        showToast('已删除');
        loadProjects();
      })
      .catch(function(e){ showToast('删除失败：' + ((e && e.message) || '网络异常'), true); });
  }

  var sortableBound = false;
  function initSortable(){
    if(typeof Sortable === 'undefined' || sortableBound) return;
    sortableBound = true;
    new Sortable(cardList, {
      animation: 200,
      ghostClass: 'sortable-ghost',
      chosenClass: 'sortable-chosen',
      onEnd: function(){
        var nodes = cardList.querySelectorAll('.card');
        if(localMode){
          var order = Array.prototype.map.call(nodes, function(n){ return n.dataset.id; });
          var map = {};
          cards.forEach(function(c){ map[String(c.id)] = c; });
          cards = order.map(function(k){ return map[k]; }).filter(Boolean);
          persistLocal(); render(); showToast('已更新排序'); return;
        }
        var ids = Array.prototype.map.call(nodes, function(n){ return Number(n.dataset.id); });
        var chain = Promise.resolve();
        ids.forEach(function(id, idx){
          chain = chain.then(function(){
            return cloud.database.from('projects').update({ sort_order: idx }).eq('id', id).select();
          });
        });
        chain.then(function(){ showToast('已更新排序'); loadProjects(); })
             .catch(function(e){ showToast('排序保存失败：' + ((e && e.message) || '网络异常'), true); });
      }
    });
  }

  dropzone.addEventListener('click', function(){ fileInput.click(); });
  fileInput.addEventListener('change', function(){
    Array.prototype.forEach.call(fileInput.files, addCard);
    fileInput.value = '';
  });
  ['dragover','dragenter'].forEach(function(ev){
    dropzone.addEventListener(ev, function(e){ e.preventDefault(); dropzone.classList.add('dragover'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    dropzone.addEventListener(ev, function(e){ e.preventDefault(); dropzone.classList.remove('dragover'); });
  });
  dropzone.addEventListener('drop', function(e){
    Array.prototype.forEach.call(e.dataTransfer.files, addCard);
  });

  document.getElementById('signInBtn').addEventListener('click', signIn);
  var lb = document.getElementById('localModeBtn');
  if(lb){ lb.addEventListener('click', showLocalMode); }

  startup();
})();
</script>
</body>
</html>
